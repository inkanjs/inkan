name: publish

# One GitHub release publishes the same build to npmjs.com (the main registry,
# trusted publishing with provenance) and to GitHub Packages. The tag has to
# match package.json.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: tag matches package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$TAG" ]; then
            echo "::error::release tag $TAG does not match package.json ($version)"
            exit 1
          fi
        env:
          TAG: ${{ github.event.release.tag_name }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node src/cli.ts check examples/shop.ts --strict

  npm:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      # trusted publishing: npm checks this workflow via OIDC, no token involved
      - run: npm publish --access public --ignore-scripts

  github-packages:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "@inkanjs"
      - run: npm ci
      - run: npm run build
      # GitHub Packages only takes packages named after the repository's owner
      - run: npm pkg set name=@inkanjs/inkan
      - run: npm publish --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
