name: bench

# inkan next to node:http, Fastify, Hono and Express on twelve scenarios, on a Linux
# runner where the network stack is not the bottleneck. Every answer is checked before it
# is measured. Started by hand; the tables land in the job summary. Shared runners are
# noisy: compare within one run, not across runs. The defaults take about an hour.

on:
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per measurement (after a 3 s warm-up)
        default: "15"
      rounds:
        description: Rounds (the median is shown)
        default: "3"
      servers:
        description: Servers, comma separated (node, fastify, hono, inkan, inkan-dev, express)
        default: "node,fastify,hono,inkan,express"

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --no-audit --no-fund
        working-directory: bench
      - name: inkan alone, without a network
        run: node inproc.mjs
        working-directory: bench
      - name: over HTTP, next to the others
        run: node run.mjs ${{ inputs.servers }} ${{ inputs.seconds }} ${{ inputs.rounds }}
        working-directory: bench
