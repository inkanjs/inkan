name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [22, 24, 26]
        include:
          - os: windows-latest
            node: 24
          - os: macos-latest
            node: 24
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: every example keeps its promise
        run: node src/cli.ts check examples/shop.ts --strict

  # app.fetch on the runtimes it is for: the same requests, Request in and Response out
  platforms:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - name: bun
        run: bun test/platforms/smoke.ts
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: deno
        run: deno run --allow-env --allow-read test/platforms/smoke.ts

