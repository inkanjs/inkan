<text class="title t0" x="420" y="31" text-anchor="middle">src/app.ts</text>
<text class="line l0" x="34" y="88" xml:space="preserve"><tspan>app.</tspan><tspan class="k">post</tspan><tspan>(</tspan><tspan class="s">"/teas"</tspan><tspan>, {</tspan></text>
<text class="line l1" x="34" y="118" xml:space="preserve"><tspan>  body: t.object({</tspan></text>
<text class="line l2" x="34" y="148" xml:space="preserve"><tspan>    name:  t.string().min(</tspan><tspan class="n">1</tspan><tspan>),</tspan></text>
<text class="line l3" x="34" y="178" xml:space="preserve"><tspan>    grams: t.int().min(</tspan><tspan class="n">1</tspan><tspan>),</tspan></text>
<text class="line l4" x="34" y="208" xml:space="preserve"><tspan>  }),</tspan></text>
<text class="line l5" x="34" y="238" xml:space="preserve"><tspan>  response: { </tspan><tspan class="n">201</tspan><tspan>: Tea },</tspan></text>
<text class="line l6" x="34" y="268" xml:space="preserve"><tspan>  examples: [{ body: { name: </tspan><tspan class="s">"Bancha"</tspan><tspan>, grams: </tspan><tspan class="n">40</tspan><tspan> } }],</tspan></text>
<text class="line l7" x="34" y="298" xml:space="preserve"><tspan>}, ({ body }) =&gt; store.add(body));</tspan></text>
<text class="line l8" x="34" y="328" xml:space="preserve"><tspan></tspan></text>
<text class="line l9" x="34" y="358" xml:space="preserve"><tspan class="c">// one contract: it checks, types, documents and tests</tspan></text>
<text class="title t1" x="420" y="31" text-anchor="middle">a request that breaks it</text>
<text class="line l10" x="34" y="88" xml:space="preserve"><tspan class="p">$ </tspan><tspan>curl -X POST localhost:3000/teas -d </tspan><tspan class="s">'{"name":"Matcha","grams":-5}'</tspan></text>
<text class="line l11" x="34" y="118" xml:space="preserve"><tspan></tspan></text>
<text class="line l12" x="34" y="148" xml:space="preserve"><tspan class="r">400 Bad Request</tspan><tspan class="c">  application/problem+json</tspan></text>
<text class="line l13" x="34" y="178" xml:space="preserve"><tspan>{</tspan></text>
<text class="line l14" x="34" y="208" xml:space="preserve"><tspan>  "type": </tspan><tspan class="s">"validation"</tspan><tspan>,</tspan></text>
<text class="line l15" x="34" y="238" xml:space="preserve"><tspan>  "detail": </tspan><tspan class="s">"The body does not match the contract"</tspan><tspan>,</tspan></text>
<text class="line l16" x="34" y="268" xml:space="preserve"><tspan>  "errors": [{ "in": </tspan><tspan class="s">"body"</tspan><tspan>, "path": </tspan><tspan class="s">"grams"</tspan><tspan>,</tspan></text>
<text class="line l17" x="34" y="298" xml:space="preserve"><tspan>               "message": </tspan><tspan class="s">"must be 1 or more"</tspan><tspan> }]</tspan></text>
<text class="line l18" x="34" y="328" xml:space="preserve"><tspan>}</tspan></text>
<text class="title t2" x="420" y="31" text-anchor="middle">examples are tests</text>
<text class="line l19" x="34" y="88" xml:space="preserve"><tspan class="p">$ </tspan><tspan>npx inkan check src/app.ts</tspan></text>
<text class="line l20" x="34" y="118" xml:space="preserve"><tspan></tspan></text>
<text class="line l21" x="34" y="148" xml:space="preserve"><tspan>  </tspan><tspan class="r">印</tspan><tspan class="b"> inkan check</tspan><tspan class="c">  ·  Tea Shop</tspan></text>
<text class="line l22" x="34" y="178" xml:space="preserve"><tspan></tspan></text>
<text class="line l23" x="34" y="208" xml:space="preserve"><tspan class="b">  GET    /teas</tspan></text>
<text class="line l24" x="34" y="238" xml:space="preserve"><tspan>    </tspan><tspan class="g">✓</tspan><tspan> every tea                          200  </tspan><tspan class="c">4ms</tspan></text>
<text class="line l25" x="34" y="268" xml:space="preserve"><tspan class="b">  POST   /teas</tspan></text>
<text class="line l26" x="34" y="298" xml:space="preserve"><tspan>    </tspan><tspan class="g">✓</tspan><tspan> a new tea                          201  </tspan><tspan class="c">0.3ms</tspan></text>
<text class="line l27" x="34" y="328" xml:space="preserve"><tspan></tspan></text>
<text class="line l28" x="34" y="358" xml:space="preserve"><tspan>  2 examples · </tspan><tspan class="g">2 sealed</tspan></text>
